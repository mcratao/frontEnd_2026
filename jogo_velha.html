<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jogo da Velha em React</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
    }

    .game {
      background: white;
      padding: 24px;
      border-radius: 10px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    .status {
      margin-bottom: 16px;
      font-size: 18px;
      font-weight: bold;
    }

    .board-row {
      display: flex;
      justify-content: center;
    }

    .square {
      width: 70px;
      height: 70px;
      border: 1px solid #999;
      background: #fff;
      font-size: 32px;
      font-weight: bold;
      cursor: pointer;
      margin: -1px 0 0 -1px;
    }

    .square:hover {
      background: #eee;
    }

    .reset {
      margin-top: 18px;
      padding: 10px 16px;
      border: 0;
      border-radius: 6px;
      background: #333;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    .reset:hover {
      background: #111;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    import React, { useState } from "https://esm.sh/react@18";
    import { createRoot } from "https://esm.sh/react-dom@18/client";

    function Square({ value, onSquareClick }) {
      return React.createElement(
        "button",
        { className: "square", onClick: onSquareClick },
        value
      );
    }

    function Board() {
      const [xIsNext, setXIsNext] = useState(true);
      const [squares, setSquares] = useState(Array(9).fill(null));

      function handleClick(i) {
        if (squares[i] || calculateWinner(squares)) {
          return;
        }

        const nextSquares = squares.slice();
        nextSquares[i] = xIsNext ? "X" : "O";
        setSquares(nextSquares);
        setXIsNext(!xIsNext);
      }

      function resetGame() {
        setSquares(Array(9).fill(null));
        setXIsNext(true);
      }

      const winner = calculateWinner(squares);
      let status;

      if (winner) {
        status = "Vencedor: " + winner;
      } else if (squares.every(Boolean)) {
        status = "Empate";
      } else {
        status = "Próximo jogador: " + (xIsNext ? "X" : "O");
      }

      return React.createElement(
        "div",
        { className: "game" },
        React.createElement("h1", null, "Jogo da Velha"),
        React.createElement("div", { className: "status" }, status),
        React.createElement(
          "div",
          null,
          React.createElement(
            "div",
            { className: "board-row" },
            React.createElement(Square, { value: squares[0], onSquareClick: () => handleClick(0) }),
            React.createElement(Square, { value: squares[1], onSquareClick: () => handleClick(1) }),
            React.createElement(Square, { value: squares[2], onSquareClick: () => handleClick(2) })
          ),
          React.createElement(
            "div",
            { className: "board-row" },
            React.createElement(Square, { value: squares[3], onSquareClick: () => handleClick(3) }),
            React.createElement(Square, { value: squares[4], onSquareClick: () => handleClick(4) }),
            React.createElement(Square, { value: squares[5], onSquareClick: () => handleClick(5) })
          ),
          React.createElement(
            "div",
            { className: "board-row" },
            React.createElement(Square, { value: squares[6], onSquareClick: () => handleClick(6) }),
            React.createElement(Square, { value: squares[7], onSquareClick: () => handleClick(7) }),
            React.createElement(Square, { value: squares[8], onSquareClick: () => handleClick(8) })
          )
        ),
        React.createElement(
          "button",
          { className: "reset", onClick: resetGame },
          "Reiniciar jogo"
        )
      );
    }

    function calculateWinner(squares) {
      const lines = [
        [0, 1, 2],
        [3, 4, 5],
        [6, 7, 8],
        [0, 3, 6],
        [1, 4, 7],
        [2, 5, 8],
        [0, 4, 8],
        [2, 4, 6]
      ];

      for (let i = 0; i < lines.length; i++) {
        const [a, b, c] = lines[i];
        if (squares[a] && squares[a] === squares[b] && squares[a] === squares[c]) {
          return squares[a];
        }
      }

      return null;
    }

    const root = createRoot(document.getElementById("root"));
    root.render(React.createElement(Board));
  </script>
</body>
</html>
